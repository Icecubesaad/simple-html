  <style>
    @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@300;500&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@300;500&family=Roboto+Condensed:wght@700&display=swap");

    .body {
      height: 15vh;

      width: 100%;
      display: flex;
    }
    .left {
      width: 100%;
      display: flex;
    }
    .right {
      width: 50%;
      display: flex;
    }
    .logo {
      width: 200px;
      height: 15vh;
      margin-right: 20px;
      display: flex;
      align-items: center;
      font-size: 1.3rem;
    }
    .options {
      height: 15vh;
      display: flex;
      align-items: center;
    }
    .options ul {
      display: flex;
      gap: 40px;
    }
    .options ul li {
      position: relative;
      display: block;
      text-decoration: none;
      font-size: 1.3rem;
      color: black;
      transition: 0.5s;
      font-family: "Nunito", sans-serif;
      cursor: pointer;
    }
    .options ul li a::after {
      position: absolute;
      content: "";
      width: 100%;
      height: 3px;
      top: 100%;
      left: 0;
      background: black;
      transition: transform 0.5s;
      transform: scaleX(0);
      transform-origin: right;
    }
    ul li a:hover {
      color: black;
    }
    ul li a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }
    .buttons {
      width: 64%;
      display: flex;
      justify-content: right;
      align-items: center;
    }
    .signin {
      width: 100px;
      height: 50px;
      color: white;
      margin-left: 20px;
      background-color: black;
      border: none;
      border-radius: 11px;
    }
    .signup {
      width: 100px;
      height: 50px;
      color: white;
      background-color: black;
      border: none;
      border-radius: 11px;
    }
    .cart-btn {
      background-color: transparent;
      border: none;
    }
    .order-cart {
      display: flex;
      align-items: center;
      width: 36%;
      justify-content: right;
    }
    .order button {
      background-color: transparent;
      border: none;
      font-size: 1rem;
      width: auto;
      cursor: pointer;
      font-family: "Nunito", sans-serif;
    }
    .order {
      margin-right: 10px;
    }
    .profile {
      height: 50px;
      width: 150px;
      background-color: grey;
      border: 1px solid transparent;
      border-radius: 30px;
      margin-left: 20px;
      display: flex;
      align-items: center;

    }
    .profile-img {
      background-color: red;
      width: 50px;
      border-radius: 30px;
      height: 50px;
    }
    .Name-profile {
      color: white;
      font-family: "Nunito", sans-serif;
      margin-left: 10px;
    }

    a {
  text-decoration: none;
  color: #000000;
}

a:hover {
  color: #222222
}

/* Dropdown */

.dropdown {
  display: inline-block;
  position: relative;
}

.dd-button {
  display: inline-block;
  border-radius: 4px;
  background-color: #222222;
  padding: 10px 30px 10px 20px;
  background-color: #ffffff;
  cursor: pointer;
  white-space: nowrap;
}

.dd-button:after {
  content: '';
  position: absolute;
  top: 50%;
  right: 15px;
  transform: translateY(-50%);
  width: 0; 
  height: 0; 
}

.dd-button:focus {
    transform: rotate(360deg);
  background-color: transparent;
}


.dd-input {
  display: none;
}

.dd-menu {
  position: absolute;
  top: 100%;
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 0;
  box-shadow: 0 0 6px 0 rgba(0,0,0,0.1);
  background-color: #ffffff;
  list-style-type: none;
}

.dd-input + .dd-menu {
  display: none;
} 

.dd-input:checked + .dd-menu {
  display: block;
} 

.dd-menu li {
  padding: 10px 20px;
  cursor: pointer;
  white-space: nowrap;
}

.dd-menu li:hover {
  background-color: #f6f6f6;
}

.dd-menu li a {
  display: block;
  margin: -10px -20px;
  padding: 10px 20px;
}

.dd-menu li.divider{
  padding: 0;
  border-bottom: 1px solid #cccccc;
}





  </style>

    function rotateText() {
